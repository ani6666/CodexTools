[package]
name = "codextools-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "CodexTools Tauri 桌面壳层"

[lib]
name = "codextools_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "codextools-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
codex-adapter = { path = "../../../crates/codex-adapter" }
codex-application = { path = "../../../crates/codex-application" }
codex-domain = { path = "../../../crates/codex-domain" }
local-infrastructure = { path = "../../../crates/local-infrastructure" }
serde = { version = "=1.0.229", features = ["derive"] }
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-single-instance = { version = "=2.4.3", features = [] }
windows-platform = { path = "../../../crates/windows-platform" }

[dev-dependencies]
serde_json = "=1.0.151"

[lints]
workspace = true
