[package]
name = "windows-platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "CodexTools 最小 Windows DPAPI 平台适配器"

[dependencies]
codex-application = { path = "../codex-application" }
codex-adapter = { path = "../codex-adapter" }
codex-domain = { path = "../codex-domain" }
zeroize = "=1.8.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_crate_dependencies = "warn"
